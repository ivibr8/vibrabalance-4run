<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Polar Circles Grid -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Polar Axes -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#475569" stroke-width="2" />
  <line x1="46" y1="256" x2="466" y2="256" stroke="#475569" stroke-width="2" />

  <!-- Run Circles Intersecting -->
  <!-- Run O Circle -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#94a3b8" stroke-width="5" />

  <!-- Run T1 (0 deg) -->
  <circle cx="366" cy="256" r="99" fill="none" stroke="#06b6d4" stroke-width="4.5" />

  <!-- Run T2 (120 deg) -->
  <circle cx="201" cy="351" r="113" fill="none" stroke="#10b981" stroke-width="4.5" />

  <!-- Run T3 (240 deg) -->
  <circle cx="201" cy="161" r="199" fill="none" stroke="#8b5cf6" stroke-width="4.5" />

  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="8" fill="#f8fafc" />

  <!-- Correction Vector -->
  <line x1="256" y1="256" x2="330" y2="152" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <!-- Vector Arrowhead -->
  <polygon points="330,152 322,170 340,166" fill="#f59e0b" />

  <!-- Correction Mass Target Dot -->
  <circle cx="330" cy="152" r="14" fill="url(#amberGrad)" stroke="#ffffff" stroke-width="3" />
</svg>
